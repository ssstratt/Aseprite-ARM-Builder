name: Build and release Aseprite for ARM Linux

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'
  workflow_dispatch:
env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch deps info
    runs-on: ubuntu-latest
    outputs:
      download-link: ${{ steps.aseprite-link.outputs.download-link }}
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:
      - name: Fetch Aseprite release link
        id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
            group: aseprite
            repo: aseprite
            match: Aseprite-.*?-Source.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info
    permissions:
      contents: write
    outputs:
      download-link: ${{ needs.fetch-aseprite-info.outputs.download-link }}
      release-tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ncipollo/release-action@v1.14.0
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Allocate Swap Space
        run: |
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240 || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          free -h

      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev clang lld libc++-dev libc++abi-dev ninja-build \
            zip python3 git curl

      - uses: actions/checkout@v4

      - name: Install Aseprite
        shell: bash
        run: |
          git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite --branch ${{ needs.create-release.outputs.release-tag }}

      - name: Compile Skia from Source for ARM64
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          # Fetch Google's build tools
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="${GITHUB_WORKSPACE}/depot_tools:${PATH}"
          
          # Initialize depot_tools to download required python/ninja binaries
          update_depot_tools
          
          # Clone Aseprite's Skia fork
          git clone -b aseprite-m124 https://github.com/aseprite/skia.git
          cd skia
          
          # Sync dependencies
          python3 tools/git-sync-deps
          
          # Configure for ARM64 and explicitly force libc++ to match Aseprite
          bin/gn gen out/Release-arm64 --args='is_debug=false is_official_build=true skia_use_system_expat=false skia_use_system_icu=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_freetype=true skia_use_system_freetype2=false skia_use_harfbuzz=true skia_use_system_harfbuzz=false skia_pdf_subset_harfbuzz=true skia_use_gl=true skia_use_dng_sdk=false cc="clang" cxx="clang++" target_cpu="arm64" extra_cflags=["-stdlib=libc++"] extra_cflags_cc=["-stdlib=libc++"] extra_ldflags=["-stdlib=libc++", "-fuse-ld=lld"]'
          
          # Compile Skia using the system Ninja
          /usr/bin/ninja -C out/Release-arm64 skia modules

      - name: Generating Makefiles
        shell: bash
        working-directory: aseprite
        run: |
          export enable_ccache=off
          export laf_backend=skia
          export enable_scripting=on
          export skia_arch=arm64
          export CC=clang
          export CXX=clang++

          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -fuse-ld=lld" \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=$enable_scripting \
            -DENABLE_CCACHE=$enable_ccache \
            -DLAF_BACKEND=$laf_backend \
            -DSKIA_DIR=${GITHUB_WORKSPACE}/skia \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DSKIA_LIBRARY_DIR=${GITHUB_WORKSPACE}/skia/out/Release-arm64

      - name: Compiling
        shell: bash
        working-directory: aseprite
        run: |
          cd build && /usr/bin/ninja -j 2

      - name: Clean Up Build folder
        working-directory: aseprite/build/bin
        shell: bash
        run: find . -mindepth 1 ! \( -name 'aseprite' -o -name 'data' -prune \) -exec rm -rf {} +

      - name: Make portable zip
        working-directory: aseprite/build/bin
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini

      - name: Create release zip
        working-directory: aseprite/build/bin
        run: zip -r Aseprite-${{ needs.create-release.outputs.release-tag }}-linux-arm64.zip *

      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.create-release.outputs.release-tag }}-linux-arm64.zip
          asset_name: Aseprite-${{ needs.create-release.outputs.release-tag }}-linux-arm64.zip
          tag: ${{ needs.create-release.outputs.release-tag }}
